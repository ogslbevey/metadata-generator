# Railway config-as-code for the "garage" service (Root Directory: /server)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Garage holds a lock on its sqlite metadata: never run two replicas,
# and stop the old container before the new one mounts the volume.
numReplicas = 1
overlapSeconds = 0
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
