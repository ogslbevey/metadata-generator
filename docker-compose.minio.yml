volumes:
  minio-data:
    driver: local

services:
  minio-console:
    build:
      context: ./minio_console
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      CONSOLE_MINIO_SERVER: http://minio:9000
      CONSOLE_ACCESS_KEY: minioadmin
      CONSOLE_SECRET_KEY: minioadmin1234
    restart: unless-stopped
    depends_on:
      - minio
    command: /bin/sh -c "exec console server --host 0.0.0.0 --port $$PORT"
    networks:
      - minio-net

  minio:
    build:
      context: ./minio_server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin1234
      MINIO_PRIVATE_PORT: 9000
      RAILWAY_VOLUME_MOUNT_PATH: /data
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9090
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    command: /bin/sh -c "exec minio server --address [::]:9000 /data"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - minio-net

networks:
  minio-net:
    driver: bridge
